<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />
  <title>Reality Distortion AR – Liquid Glass Flow</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    #camera,
    #glcanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #camera {
      z-index: 1;
      object-fit: cover;
      background: #000;
      transform-origin: center;
    }

    #glcanvas {
      z-index: 2;
      pointer-events: none;
    }

    #ui {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    #hint {
      position: absolute;
      left: 50%;
      bottom: 17%;
      transform: translateX(-50%);
      max-width: calc(100vw - 36px);
      padding: 10px 16px;
      border-radius: 999px;
      color: #fff;
      background: rgba(0, 0, 0, 0.58);
      font-size: 14px;
      text-align: center;
      white-space: nowrap;
      transition: opacity 0.5s ease;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    #hint.hidden {
      opacity: 0;
    }

    #controls {
      position: absolute;
      right: max(12px, env(safe-area-inset-right));
      bottom: max(12px, env(safe-area-inset-bottom));
      pointer-events: auto;
    }

    button {
      min-height: 42px;
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      color: #fff;
      background: rgba(0, 0, 0, 0.58);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    button:active {
      background: rgba(255, 255, 255, 0.2);
    }

    button:disabled {
      opacity: 0.55;
    }

    #tapStart {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      padding: 24px;
      color: #fff;
      background: rgba(0, 0, 0, 0.86);
      text-align: center;
      pointer-events: auto;
    }

    #tapStart p {
      max-width: 330px;
      margin: 0;
      line-height: 1.45;
    }

    #startBtn {
      color: #000;
      background: #fff;
      border-color: #fff;
    }

    #status {
      min-height: 20px;
      max-width: 340px;
      color: #ffbaba;
      font-size: 12px;
      line-height: 1.4;
    }

    .back-home {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
      z-index: 100;

      display: inline-flex;
      align-items: center;
      gap: 8px;

      min-height: 38px;
      padding: 0 13px;

      border: 1px solid rgba(212, 184, 150, 0.34);
      border-radius: 999px;

      color: #f0d5ad;
      background: rgba(10, 10, 9, 0.74);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.11em;
      text-decoration: none;
      text-transform: uppercase;

      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }

    .back-home span {
      font-size: 16px;
      font-weight: 300;
      line-height: 1;
    }

    @media (max-width: 650px) {
      .back-home {
        top: max(12px, env(safe-area-inset-top));
        left: max(12px, env(safe-area-inset-left));
        min-height: 34px;
        padding: 0 11px;
        font-size: 9px;
      }

      #hint {
        white-space: normal;
      }
    }
  </style>
</head>

<body>
  <a class="back-home" href="../index.html" aria-label="Back to Wavelength">
    <span aria-hidden="true">←</span>
    Wavelength
  </a>

  <main id="app">
    <video id="camera" autoplay muted playsinline></video>
    <canvas id="glcanvas"></canvas>

    <div id="ui">
      <div id="hint">Show one hand clearly in front of the camera</div>

      <div id="controls">
        <button id="flipBtn" type="button">Flip Camera</button>
      </div>

      <div id="tapStart">
        <p>Tap Start, allow camera access, then move one hand in front of the camera.</p>
        <button id="startBtn" type="button">Start Experience</button>
        <p id="status" role="alert"></p>
      </div>
    </div>
  </main>

  <!-- WebGL vertex shader -->
  <script id="vertexShader" type="x-shader/x-vertex">
    attribute vec2 a_position;
    varying vec2 v_uv;

    void main() {
      v_uv = a_position * 0.5 + 0.5;
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  </script>

  <!-- WebGL fragment shader -->
  <script id="fragmentShader" type="x-shader/x-fragment">
    precision mediump float;

    varying vec2 v_uv;

    uniform sampler2D u_camera;
    uniform int u_centerCount;

    const int MAX_CENTERS = 8;
    uniform vec3 u_lenses[MAX_CENTERS];

    uniform float u_motion;
    uniform vec2 u_flow;

    vec2 liquidField(vec2 uv, out float fieldStrength) {
      vec2 accumulatedDirection = vec2(0.0);
      float totalInfluence = 0.0;

      for (int i = 0; i < MAX_CENTERS; i++) {
        if (i >= u_centerCount) {
          break;
        }

        vec3 lens = u_lenses[i];
        vec2 centre = lens.xy;
        float strength = lens.z;

        if (strength <= 0.001) {
          continue;
        }

        vec2 delta = centre - uv;
        float distanceToCentre = length(delta);
        float radius = 0.34;

        if (distanceToCentre > radius) {
          continue;
        }

        float normalisedDistance = distanceToCentre / radius;
        float falloff = pow(1.0 - normalisedDistance, 2.0);
        float influence = falloff * strength;

        vec2 direction = distanceToCentre > 0.0001
          ? normalize(delta)
          : vec2(0.0);

        accumulatedDirection += direction * influence;
        totalInfluence += influence;
      }

      if (totalInfluence > 0.0) {
        accumulatedDirection /= totalInfluence;
      }

      fieldStrength = clamp(totalInfluence, 0.0, 1.0);

      return accumulatedDirection;
    }

    vec3 blurAlongDirection(
      sampler2D texture,
      vec2 uv,
      vec2 direction,
      float blurAmount
    ) {
      vec3 colour = vec3(0.0);
      float totalWeight = 0.0;

      for (int i = -2; i <= 2; i++) {
        float weight = 1.0 - abs(float(i)) / 2.5;

        vec2 sampleUV = uv + direction * blurAmount * float(i);
        sampleUV = clamp(sampleUV, 0.001, 0.999);

        colour += texture2D(texture, sampleUV).rgb * weight;
        totalWeight += weight;
      }

      return colour / totalWeight;
    }

    void main() {
      vec2 uv = vec2(v_uv.x, 1.0 - v_uv.y);

      float fieldStrength;
      vec2 localDirection = liquidField(uv, fieldStrength);

      vec2 combinedDirection = u_flow + localDirection * 0.85;
      float combinedLength = length(combinedDirection);

      vec2 flowDirection = combinedLength > 0.0001
        ? combinedDirection / combinedLength
        : vec2(0.0);

      float flowStrength = clamp(length(u_flow), 0.0, 1.0);

      float distortionAmount =
        (0.025 + 0.11 * u_motion) * fieldStrength +
        0.035 * flowStrength;

      vec2 offset = flowDirection * distortionAmount;

      vec3 originalColour = texture2D(u_camera, uv).rgb;

      float blurAmount =
        0.04 * fieldStrength +
        0.025 * flowStrength;

      vec3 distortedColour = blurAlongDirection(
        u_camera,
        uv + offset,
        flowDirection,
        blurAmount
      );

      float glassAmount = clamp(
        fieldStrength * (0.28 + u_motion * 0.9) +
        flowStrength * 0.45,
        0.0,
        1.0
      );

      vec3 finalColour = mix(
        originalColour,
        distortedColour,
        glassAmount
      );

      float highlight = smoothstep(0.15, 0.82, glassAmount);
      finalColour += vec3(highlight * 0.055);

      gl_FragColor = vec4(finalColour, 1.0);
    }
  </script>

  <!--
    THESE ARE THE CORRECT MEDIAPIPE URLS.
    Do not replace them with any URL containing [email protected].
  -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

  <script>
    (() => {
      "use strict";

      const video = document.getElementById("camera");
      const canvas = document.getElementById("glcanvas");
      const startButton = document.getElementById("startBtn");
      const flipButton = document.getElementById("flipBtn");
      const overlay = document.getElementById("tapStart");
      const hint = document.getElementById("hint");
      const status = document.getElementById("status");

      /*
        Eight landmark points make this mobile-safe.
        0 wrist, 4 thumb tip, 8 index tip, 12 middle tip,
        16 ring tip, 20 pinky tip, 5 index base, 17 pinky base.
      */
      const LENS_INDICES = [0, 4, 8, 12, 16, 20, 5, 17];
      const MAX_CENTERS = LENS_INDICES.length;
      const TRACKING_INTERVAL = 50;

      let gl = null;
      let program = null;
      let quadBuffer = null;
      let cameraTexture = null;

      let aPosition = null;
      let uCamera = null;
      let uCenterCount = null;
      let uLenses = null;
      let uMotion = null;
      let uFlow = null;

      let hands = null;
      let stream = null;

      let isStreaming = false;
      let isStarting = false;
      let animationStarted = false;
      let trackingBusy = false;

      let facingMode = "environment";
      let mirrored = false;
      let lastTrackingTime = 0;
      let previousFrameTime = 0;

      const lensData = new Float32Array(MAX_CENTERS * 3);

      const hand = {
        visible: false,
        strength: 0,
        lastSeen: 0,
        points: Array.from(
          { length: MAX_CENTERS },
          () => [0.5, 0.5]
        )
      };

      let lastHandPosition = null;
      let motion = 0;

      const flow = {
        x: 0,
        y: 0
      };

      function setStatus(message = "") {
        status.textContent = message;
      }

      function compileShader(type, source) {
        const shader = gl.createShader(type);

        gl.shaderSource(shader, source);
        gl.compileShader(shader);

        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          const error = gl.getShaderInfoLog(shader);
          gl.deleteShader(shader);
          throw new Error(`Shader error: ${error}`);
        }

        return shader;
      }

      function setupWebGL() {
        if (gl) return;

        gl = canvas.getContext("webgl", {
          alpha: false,
          antialias: false,
          powerPreference: "high-performance"
        });

        if (!gl) {
          throw new Error("WebGL is not available in this browser.");
        }

        console.log(
          "MAX_FRAGMENT_UNIFORM_VECTORS:",
          gl.getParameter(gl.MAX_FRAGMENT_UNIFORM_VECTORS)
        );

        const vertexSource = document
          .getElementById("vertexShader")
          .textContent
          .trim();

        const fragmentSource = document
          .getElementById("fragmentShader")
          .textContent
          .trim();

        const vertexShader = compileShader(
          gl.VERTEX_SHADER,
          vertexSource
        );

        const fragmentShader = compileShader(
          gl.FRAGMENT_SHADER,
          fragmentSource
        );

        program = gl.createProgram();

        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);

        gl.deleteShader(vertexShader);
        gl.deleteShader(fragmentShader);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          throw new Error(
            `Shader link error: ${gl.getProgramInfoLog(program)}`
          );
        }

        gl.useProgram(program);

        aPosition = gl.getAttribLocation(program, "a_position");
        uCamera = gl.getUniformLocation(program, "u_camera");
        uCenterCount = gl.getUniformLocation(program, "u_centerCount");
        uLenses = gl.getUniformLocation(program, "u_lenses[0]");
        uMotion = gl.getUniformLocation(program, "u_motion");
        uFlow = gl.getUniformLocation(program, "u_flow");

        if (
          aPosition === -1 ||
          uCamera === null ||
          uCenterCount === null ||
          uLenses === null ||
          uMotion === null ||
          uFlow === null
        ) {
          throw new Error("Could not find required shader variables.");
        }

        quadBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);

        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([
            -1, -1,
             1, -1,
            -1,  1,
             1,  1
          ]),
          gl.STATIC_DRAW
        );

        cameraTexture = gl.createTexture();

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, cameraTexture);

        gl.texParameteri(
          gl.TEXTURE_2D,
          gl.TEXTURE_WRAP_S,
          gl.CLAMP_TO_EDGE
        );

        gl.texParameteri(
          gl.TEXTURE_2D,
          gl.TEXTURE_WRAP_T,
          gl.CLAMP_TO_EDGE
        );

        gl.texParameteri(
          gl.TEXTURE_2D,
          gl.TEXTURE_MIN_FILTER,
          gl.LINEAR
        );

        gl.texParameteri(
          gl.TEXTURE_2D,
          gl.TEXTURE_MAG_FILTER,
          gl.LINEAR
        );

        gl.uniform1i(uCamera, 0);

        resizeCanvas();

        window.addEventListener("resize", resizeCanvas);

        window.addEventListener("orientationchange", () => {
          setTimeout(resizeCanvas, 250);
        });
      }

      function resizeCanvas() {
        if (!gl) return;

        /*
          Prevents extremely expensive 3x / 4x phone rendering.
        */
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        const width = Math.floor(canvas.clientWidth * dpr);
        const height = Math.floor(canvas.clientHeight * dpr);

        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }

        gl.viewport(0, 0, canvas.width, canvas.height);
      }

      async function setupHands() {
        if (hands) return;

        /*
          This catches the exact issue shown in your screenshot
          before the program attempts `new Hands(...)`.
        */
        if (typeof window.Hands === "undefined") {
          throw new Error(
            "MediaPipe failed to load. Check your internet connection, then hard-refresh this page."
          );
        }

        hands = new window.Hands({
          locateFile: (file) =>
            `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
          maxNumHands: 1,
          modelComplexity: 1,
          minDetectionConfidence: 0.45,
          minTrackingConfidence: 0.45
        });

        hands.onResults(onHandResults);
      }

      function onHandResults(results) {
        const landmarks = results.multiHandLandmarks?.[0];
        const now = performance.now();

        if (!landmarks) {
          if (now - hand.lastSeen > 350) {
            hand.visible = false;
          }
          return;
        }

        const points = [];

        for (const landmarkIndex of LENS_INDICES) {
          const landmark = landmarks[landmarkIndex];

          const x = mirrored
            ? 1 - landmark.x
            : landmark.x;

          const y = landmark.y;

          points.push([x, y]);
        }

        hand.points = points;
        hand.visible = true;
        hand.lastSeen = now;

        hint.classList.add("hidden");

        let averageX = 0;
        let averageY = 0;

        for (const [x, y] of points) {
          averageX += x;
          averageY += y;
        }

        averageX /= points.length;
        averageY /= points.length;

        if (lastHandPosition) {
          const dx = averageX - lastHandPosition.x;
          const dy = averageY - lastHandPosition.y;
          const speed = Math.hypot(dx, dy);

          motion = motion * 0.86 + Math.min(speed * 20, 1) * 0.24;

          flow.x = flow.x * 0.86 + dx * 1.8;
          flow.y = flow.y * 0.86 + dy * 1.8;
        }

        lastHandPosition = {
          x: averageX,
          y: averageY
        };
      }

      async function stopCamera() {
        isStreaming = false;

        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          stream = null;
        }

        video.srcObject = null;
      }

      async function startCamera() {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            "Camera access is unavailable. Use HTTPS in Chrome or Safari."
          );
        }

        await stopCamera();

        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: { ideal: facingMode },
              width: { ideal: 960 },
              height: { ideal: 540 },
              frameRate: { ideal: 24, max: 30 }
            }
          });
        } catch (firstError) {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: true
          });
        }

        video.srcObject = stream;
        video.muted = true;
        video.playsInline = true;

        await video.play();

        const track = stream.getVideoTracks()[0];
        const settings = track.getSettings
          ? track.getSettings()
          : {};

        const actualFacingMode =
          settings.facingMode || facingMode;

        mirrored = actualFacingMode === "user";

        video.style.transform = mirrored
          ? "scaleX(-1)"
          : "none";

        isStreaming = true;
      }

      function updateHandState(deltaTime) {
        const targetStrength = hand.visible ? 1 : 0;
        const speed = hand.visible ? 6 : 2.5;

        hand.strength +=
          (targetStrength - hand.strength) *
          Math.min(deltaTime * speed, 1);

        hand.strength = Math.max(
          0,
          Math.min(1, hand.strength)
        );

        if (!hand.visible) {
          motion *= 0.95;
          flow.x *= 0.93;
          flow.y *= 0.93;

          if (hand.strength < 0.01) {
            lastHandPosition = null;
          }
        }

        motion *= 0.99;
      }

      function uploadLenses() {
        let count = 0;

        for (let i = 0; i < MAX_CENTERS; i++) {
          const offset = i * 3;

          if (hand.strength > 0.001) {
            const point = hand.points[i] || [0.5, 0.5];

            lensData[offset] = point[0];
            lensData[offset + 1] = point[1];
            lensData[offset + 2] = hand.strength;

            count++;
          } else {
            lensData[offset] = 0;
            lensData[offset + 1] = 0;
            lensData[offset + 2] = 0;
          }
        }

        gl.uniform1i(uCenterCount, count);
        gl.uniform3fv(uLenses, lensData);
      }

      async function trackHand(now) {
        if (
          !isStreaming ||
          !hands ||
          trackingBusy ||
          now - lastTrackingTime < TRACKING_INTERVAL ||
          video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA
        ) {
          return;
        }

        trackingBusy = true;
        lastTrackingTime = now;

        try {
          await hands.send({ image: video });
        } catch (error) {
          console.error("MediaPipe tracking error:", error);
        } finally {
          trackingBusy = false;
        }
      }

      function render(now) {
        requestAnimationFrame(render);

        if (
          !isStreaming ||
          !gl ||
          video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA
        ) {
          return;
        }

        const deltaTime = Math.min(
          (now - previousFrameTime) / 1000 || 0.016,
          0.1
        );

        previousFrameTime = now;

        updateHandState(deltaTime);
        trackHand(now);

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, cameraTexture);

        gl.texImage2D(
          gl.TEXTURE_2D,
          0,
          gl.RGBA,
          gl.RGBA,
          gl.UNSIGNED_BYTE,
          video
        );

        gl.clearColor(0, 0, 0, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);

        gl.useProgram(program);

        gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);

        gl.enableVertexAttribArray(aPosition);
        gl.vertexAttribPointer(
          aPosition,
          2,
          gl.FLOAT,
          false,
          0,
          0
        );

        gl.uniform1f(uMotion, motion);
        gl.uniform2f(uFlow, flow.x, flow.y);

        uploadLenses();

        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }

      async function startExperience() {
        if (isStarting || isStreaming) return;

        isStarting = true;
        startButton.disabled = true;
        startButton.textContent = "Starting...";
        setStatus("");

        try {
          if (!window.isSecureContext) {
            throw new Error(
              "This page must be hosted through HTTPS for camera access."
            );
          }

          setupWebGL();
          await setupHands();
          await startCamera();

          overlay.style.display = "none";

          if (!animationStarted) {
            animationStarted = true;
            requestAnimationFrame(render);
          }
        } catch (error) {
          console.error("Startup error:", error);

          if (error.name === "NotAllowedError") {
            setStatus(
              "Camera permission was denied. Enable it in browser settings, then reload."
            );
          } else if (error.name === "NotFoundError") {
            setStatus("No working camera was found.");
          } else {
            setStatus(
              error.message || "Could not start the experience."
            );
          }
        } finally {
          isStarting = false;
          startButton.disabled = false;
          startButton.textContent = "Start Experience";
        }
      }

      async function flipCamera() {
        if (isStarting) return;

        facingMode =
          facingMode === "user"
            ? "environment"
            : "user";

        if (!isStreaming) return;

        try {
          await startCamera();
        } catch (error) {
          console.error("Camera flip error:", error);
          setStatus("Could not switch camera.");
        }
      }

      startButton.addEventListener("click", startExperience);
      flipButton.addEventListener("click", flipCamera);

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          hand.visible = false;
          lastHandPosition = null;
        }
      });

      window.addEventListener("beforeunload", stopCamera);
    })();
  </script>
</body>
</html>
